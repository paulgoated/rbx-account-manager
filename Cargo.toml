[package]
name = "rbx-account-manager"
version = "2.3.0"
edition = "2021"
description = "Local Roblox account manager. Accounts are encrypted with Windows DPAPI and never leave your PC."

[[bin]]
name = "RBXAccountManager"
path = "src/main.rs"

[dependencies]
eframe = "=0.31.1"
ureq = { version = "2.12", default-features = false, features = ["native-tls"] }
native-tls = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
raw-window-handle = "0.6"
sha2 = "0.10"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Dwm",
    "Win32_System_SystemInformation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_LibraryLoader",
    "Win32_System_Com",
    "Win32_Graphics_Gdi",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"
